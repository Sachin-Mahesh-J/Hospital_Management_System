name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hms_development
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hms_development"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hms_development?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hms_development?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npm run prisma:generate
      - name: Validate Prisma schema
        run: npm run prisma:validate -w backend
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Backend and frontend tests
        run: npm test
      - name: Database tests
        run: npm run test:database
      - name: Production builds
        run: npm run build
      - name: npm audit
        run: npm audit
